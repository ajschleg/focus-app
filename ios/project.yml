name: FocusSlice
options:
  bundleIdPrefix: com.ajschleg
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Leave DEVELOPMENT_TEAM blank here — set your team once in Xcode's
    # "Signing & Capabilities" tab. A free Apple ID is enough to run on a device.
    DEVELOPMENT_TEAM: ""

targets:
  FocusSlice:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    scheme: {}   # generate a shared scheme so a clean clone can build without Xcode autocreating one
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ajschleg.FocusSlice
        TARGETED_DEVICE_FAMILY: "1"        # iPhone only
        GENERATE_INFOPLIST_FILE: "YES"
        ENABLE_PREVIEWS: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: FocusSlice
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_NSMotionUsageDescription: "FocusSlice reads device motion to detect when you pick up your phone during a focus block, so it can log it as a distraction."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
