name: FocusSlice
options:
  bundleIdPrefix: com.ajschleg
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  FocusSlice:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      # App icon lives here; regenerate it with ios/Tools/make-app-icon.swift.
      - path: Assets.xcassets
    scheme: {}   # generate a shared scheme so a clean clone can build without Xcode autocreating one
    entitlements:
      # Lets the phase-end notifications break through Focus/DND modes (and
      # the Scheduled Summary) — a timer the user explicitly started is what
      # Time Sensitive is for. Remove this block if signing complains;
      # notifications then degrade to the default interruption level.
      path: FocusSlice.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
    configFiles:
      # DEVELOPMENT_TEAM lives in the gitignored Signing.local.xcconfig so it
      # never enters version control — see ios/Signing.xcconfig.
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ajschleg.FocusSlice
        TARGETED_DEVICE_FAMILY: "1"        # iPhone only
        GENERATE_INFOPLIST_FILE: "YES"
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: FocusSlice
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_NSMotionUsageDescription: "FocusSlice reads device motion to detect when you pick up your phone during a focus block, so it can log it as a distraction."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
